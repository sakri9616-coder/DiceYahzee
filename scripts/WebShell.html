<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1115">
  <title>DiceYahzee</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b1115; }
    body { display: grid; place-items: center; }
    #shell { position: relative; width: min(100vw, 177.7778vh); height: min(100vh, 56.25vw); overflow: hidden;
      background: radial-gradient(ellipse at center, #20343d, #0b1115 75%); }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px;
      background: radial-gradient(ellipse at center, #20343d, #0b1115 75%); }
    #brand { color: #d2ae68; font: 34px Georgia, serif; letter-spacing: .04em; }
    #track { width: min(240px, 58vw); height: 3px; background: #38505a; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #d2ae68; transition: width .15s linear; }
    #error { position: absolute; inset: auto 8% 8%; color: #f4c5bc; text-align: center;
      font: 16px sans-serif; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main id="shell">
    <canvas id="game" tabindex="0" aria-label="DiceYahzee"></canvas>
    <div id="loading" aria-live="polite"><div id="brand">DiceYahzee</div><div id="track"><div id="fill"></div></div></div>
    <div id="error" role="alert"></div>
  </main>
  <script src="Build/{{BUILD_PREFIX}}.loader.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    createUnityInstance(canvas, {
      dataUrl: 'Build/{{BUILD_PREFIX}}.data',
      frameworkUrl: 'Build/{{BUILD_PREFIX}}.framework.js',
      codeUrl: 'Build/{{BUILD_PREFIX}}.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'DiceYahzee',
      productName: 'DiceYahzee',
      productVersion: '{{PRODUCT_VERSION}}',
      showBanner: (message, type) => { if (type === 'error') error.textContent = message; }
    }, progress => { document.getElementById('fill').style.width = (progress * 100) + '%'; })
      .then(() => { loading.style.display = 'none'; canvas.focus(); })
      .catch(message => { loading.style.display = 'none'; error.textContent = String(message); });
  </script>
</body>
</html>
